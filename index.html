<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://opengraph.b-cdn.net/production/images/dc2b675f-633c-4c17-842a-c5da90f97b29.png?token=-wptlSwSIpRqeH29hCpxB640qM5XKtRzXj0w1XFJ4d4&height=630&width=1200&expires=33290741024">
    <meta property="og:description" content="Real-time currency converter using Bank Negara Malaysia exchange rates.">
    <meta name="color-scheme" content="dark light">
    <title>Currency Converter</title>
    <link rel="stylesheet" type="text/css" href="css/styles.css">
    <link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Currency Converter</h1>
            <p class="subtitle">Check live foreign currency exchange rates</p>
        </div>
        
        <div class="converter-section">
            <div class="source-row">
                <div class="currency-input-group">
                    <input type="number" class="currency-input" id="fromAmount" placeholder="1" value="1">
                    <select class="currency-select" id="fromCurrency"></select>
                </div>
                <div class="source-rate" id="sourceRate"></div>
            </div>
            
            <div id="targetsContainer"></div>
            
            <select class="add-target-select" id="addTargetSelect">
                <option value="">+ Add target currency</option>
            </select>
            
            <div class="error" id="errorMessage" style="display: none;"></div>
            <div class="last-updated" id="lastUpdated">
                <span class="bnm-icon"></span>
                <span id="lastUpdatedText"></span>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js");
        }
    </script>
    <script type="module" defer>
      import { polyfillCountryFlagEmojis } from "https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1.8/+esm";
      polyfillCountryFlagEmojis();
    </script>
</body>
</html>
